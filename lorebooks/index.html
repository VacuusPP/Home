
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON Comment & Content Extractor</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 40px;
        max-width: 700px;
        margin: auto;
    }
    .container {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 2px 10px #0001;
    }
    button {
        padding: 12px 20px;
        margin-top: 15px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
    button:disabled {
        background: #999;
        cursor: not-allowed;
    }
    textarea {
        width: 100%;
        height: 200px;
        margin-top: 15px;
        box-sizing: border-box;
    }
    #status {
        margin-top: 15px;
        color: #333;
    }
</style>
</head>
<body>

<div class="container">
    <h2>JSON Extractor</h2>
    <p>Upload a JSON file to extract comments and content.</p>

    <input type="file" id="fileInput" accept=".json">

    <br>
    <button onclick="extractJSON()">Extract & Download TXT</button>

    <p id="status"></p>

    <textarea id="preview" placeholder="Extracted text will appear here..." readonly></textarea>
</div>

<script>
async function extractJSON() {
    const file = document.getElementById("fileInput").files[0];
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");

    if (!file) {
        status.textContent = "Please select a JSON file.";
        return;
    }

    try {
        const text = await file.text();
        const data = JSON.parse(text);

        // Support either an array or a single object
        const entries = Array.isArray(data) ? data : [data];

        const output = entries.map(entry => {
            const comment = entry.comment ?? "";
            const content = entry.content ?? "";

            return `Comment: ${comment}\nContent: ${content}`;
        }).join("\n\n");

        preview.value = output;

        const blob = new Blob([output], {
            type: "text/plain;charset=utf-8"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = file.name.replace(/\.json$/i, "") + ".txt";
        link.click();

        URL.revokeObjectURL(url);

        status.textContent =
            `Successfully extracted ${entries.length} entries!`;

    } catch (error) {
        status.textContent = "Error: Invalid JSON file or structure.";
    }
}
</script>

</body>
</html>
