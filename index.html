<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<meta name="description" content="A collection of my projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --ink: #efe6d2;
    --muted: #a79f8c;
    --gold: #c9a227;
    --gold-hi: #f1d77a;
    --gold-lo: #8a6d12;
    --rule: rgba(201, 162, 39, 0.35);
    --foil: linear-gradient(135deg, #6e4f08 0%, #b8890f 14%, #f6e08c 28%, #d4a82a 42%, #8c6409 56%, #e6c35a 72%, #fff2b8 82%, #b8860b 92%, #6e4f08 100%);
    --display: "Cormorant Garamond", "Garamond", "Palatino Linotype", Georgia, serif;
    --body: "EB Garamond", "Garamond", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 1.15rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 52rem;
    margin: 0 auto;
    padding: clamp(3rem, 10vw, 7rem) 1.5rem 4rem;
  }

  header { margin-bottom: clamp(2.5rem, 7vw, 5rem); }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(3.2rem, 12vw, 6.5rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
    background:
      linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.95) 50%, transparent 60%) no-repeat,
      var(--foil);
    background-size: 250% 100%, 100% 100%;
    background-position: 150% 0, 0 0;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(201, 162, 39, 0.25));
    animation: glint 7s ease-in-out 0.6s infinite;
  }
  @keyframes glint {
    0%   { background-position: 150% 0, 0 0; }
    22%  { background-position: -50% 0, 0 0; }
    100% { background-position: -50% 0, 0 0; }
  }
  .tagline {
    margin: 1.25rem 0 0;
    max-width: 34rem;
    color: var(--muted);
    font-style: italic;
    font-size: 1.25rem;
  }

  ul.links { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  ul.links li { border-bottom: 1px solid var(--rule); }
  .link {
    position: relative;
    display: block;
    padding: 1.5rem 0.75rem;
    color: inherit;
    text-decoration: none;
    isolation: isolate;
    transition: padding-left 0.25s ease;
  }
  .link::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: var(--foil);
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform 0.25s ease;
  }
  .name {
    display: block;
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(1.7rem, 5vw, 2.3rem);
    line-height: 1.15;
    background: var(--foil);
    background-size: 100% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .desc {
    display: block;
    margin-top: 0.2rem;
    color: var(--muted);
    transition: color 0.25s ease;
  }
  .link:hover, .link:focus-visible { padding-left: 1.5rem; }
  .link:hover::before, .link:focus-visible::before { transform: scaleY(1); }
  .link:hover .name, .link:focus-visible .name { background: none; color: #000; }
  .link:hover .desc, .link:focus-visible .desc { color: #000; }
  .link:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }

  .empty { color: var(--muted); font-style: italic; }

  footer {
    margin-top: 3.5rem;
    color: var(--muted);
    font-size: 0.95rem;
  }

  @media (hover: none) {
    .link:hover { padding-left: 0.75rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    h1 { animation: none; background-position: -50% 0, 0 0; }
    .link, .link::before, .name, .desc { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <p class="tagline" id="tagline"></p>
  </header>

  <ul class="links" id="links"></ul>

  <footer id="footer"></footer>
</main>

<script>
/* ==========================================================
   EDIT THIS SECTION ONLY
   To add a project, copy one line inside LINKS and change it.
   Order here = order on the page.
   ========================================================== */
const SITE = {
  title: "Projects",
  tagline: "Tools, experiments and things I have built.",
  footer: "Made by Vacuus"
};

const LINKS = [
  { name: "Frame Chopper",  url: "https://vacuuspp.github.io/Home/frames/", desc: "Converts Videos & Gifs into their PNG Frames" },
  { name: "Lorebook Converter",      url: "https://vacuuspp.github.io/Home/lorebooks/",     desc: "Converts Lorebook Format" },
];
/* ========================================================== */

document.title = SITE.title;
document.getElementById("title").textContent = SITE.title;
document.getElementById("tagline").textContent = SITE.tagline;
document.getElementById("footer").textContent = SITE.footer;

const list = document.getElementById("links");
if (!LINKS.length) {
  const li = document.createElement("li");
  li.className = "empty";
  li.textContent = "No projects yet. Add one to the LINKS list in index.html.";
  list.appendChild(li);
}
LINKS.forEach(({ name, url, desc }) => {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.className = "link";
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  const n = document.createElement("span");
  n.className = "name";
  n.textContent = name;
  a.appendChild(n);
  if (desc) {
    const d = document.createElement("span");
    d.className = "desc";
    d.textContent = desc;
    a.appendChild(d);
  }
  li.appendChild(a);
  list.appendChild(li);
});
</script>
</body>
</html>
